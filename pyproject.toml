# Project definition
[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbTT"
version = "0.2.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
# where to look for packages
where = ["src"]

[tool.vulture]
# Ignore specific files
exclude = [
    "src/bbTT/monitoring/logger/logger.py", # reason: most settings are unused
    "src/bbTT/utils/parser.py", # reason: uses a lot of building blocks that are loaded dynamically
    "src/bbTT/utils/utils.py"
]

# Ignore specific function, variable, or class names (supports wildcards like ? and *)
ignore_names = [
    "expand_braces",
    "TODO *",
    "requires_grad",
    "clip_gradient",
]

# Ignore specific decorators
ignore_decorators = [
    "@register_loop*",
    "@property",
    "@register_model*",
    "*.register_learning_mode",
    "@dataclass*"
]

# linting
[tool.ruff]
builtins = [
    "ExceptionGroup",
    "BaseExceptionGroup",
    ]

line-length = 120
target-version = "py39"

[tool.ruff.lint]

select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "I",  # isort
]

ignore = [
    "E501",
    "E702", # multiple statements in one line
    "B904", # raise-without-from-inside-except - reduces information in stack trace
    "B905", # older python version < 3.10 don't support this
    "B008", # function calls when defining defaults, most important case for me torch.tensors
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
